<title>Passaporte do Saber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1B4B;
    --ink-2:#4F4C78;
    --muted:#807DA6;
    --bg:#F4F3FF;
    --card:#FFFFFF;
    --line:#E4E3F4;
    --line-2:#CFCDEA;

    --violeta:#6C4DFF;
    --violeta-2:#8B6CFF;
    --violeta-esc:#4B2FD6;
    --violeta-shade:#3E27B8;
    --sol:#FFC53D;
    --sol-2:#FFD766;
    --sol-esc:#B07A00;
    --sol-shade:#D99A00;
    --menta:#22C58B;
    --menta-2:#3DD69E;
    --menta-esc:#0E8F62;
    --menta-shade:#0B7D55;
    --coral:#FF5A6E;
    --coral-esc:#C8324A;
    --coral-shade:#D8415A;
    --ceu:#3B82F6;

    /* tipos do calendário */
    --t-sistematizada:#BE123C;
    --t-avaliacao:#E11D48;
    --t-atividade:#2563EB;
    --t-trabalho:#059669;
    --t-entrega:#F59E0B;
    --t-evento:#8B5CF6;
    --t-feriado:#94A3B8;

    --fd:'Baloo 2', 'Nunito', system-ui, sans-serif;
    --fb:'Nunito', 'Segoe UI', system-ui, sans-serif;
    --raio:22px;
    --sombra-s:0 1px 2px rgba(30,27,75,0.05), 0 8px 20px rgba(30,27,75,0.07);
    --sombra-m:0 2px 4px rgba(30,27,75,0.06), 0 16px 36px rgba(30,27,75,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    min-height:100vh;
    font-family:var(--fb);
    color:var(--ink);
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 420px at 50% -160px, rgba(108,77,255,0.20), transparent 70%),
      radial-gradient(rgba(30,27,75,0.055) 1.2px, transparent 1.4px);
    background-size:auto, 22px 22px;
    background-repeat:no-repeat, repeat;
    padding:10px 16px 40px;
    overflow-x:hidden;
  }
  .app{width:100%; max-width:560px; margin:0 auto;}
  button{font-family:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  button:focus-visible, .btn:focus-visible, input:focus-visible{outline:3px solid var(--sol); outline-offset:3px;}
  b, strong{font-weight:900;}

  /* ---------- ENTRADA DE TELA ---------- */
  #screen.enter{animation:entra .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes entra{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

  /* ---------- TOPO ---------- */
  .topo{
    position:sticky; top:8px; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px 8px 12px; margin-bottom:14px;
    background:rgba(255,255,255,0.82);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1.5px solid rgba(255,255,255,0.95); border-radius:18px;
    box-shadow:var(--sombra-s);
  }
  .logo{display:flex; align-items:center; gap:10px; background:none; border:0; padding:0; cursor:pointer; text-align:left;}
  .logo-selo{
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg, #8B6CFF, #5A3DE6);
    display:grid; place-items:center; color:#fff;
    box-shadow:0 4px 12px rgba(108,77,255,0.38);
    transform:rotate(-6deg);
  }
  .logo-selo svg{width:22px; height:22px;}
  .logo-texto b{display:block; font-family:var(--fd); font-weight:800; font-size:19px; line-height:1; color:var(--violeta-esc);}
  .logo-texto span{display:block; font-size:12px; font-weight:800; color:var(--muted); margin-top:2px;}
  .topo-acoes{display:flex; align-items:center; gap:8px;}
  .pill{
    display:inline-flex; align-items:center; gap:4px; padding:0 10px; height:36px;
    border-radius:99px; font-weight:900; font-size:13.5px;
    background:#FFF1C9; color:#8A5B00; border:1.5px solid #FFE08A;
  }
  .icone-btn{
    width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; font-size:18px; cursor:pointer;
    box-shadow:0 2px 0 var(--line); display:grid; place-items:center;
  }
  .icone-btn:active{transform:translateY(2px); box-shadow:none;}

  /* ---------- BLOCOS BASE ---------- */
  .card{
    background:var(--card); border:1.5px solid var(--line);
    border-radius:var(--raio); box-shadow:var(--sombra-s);
    padding:18px; margin-bottom:14px; position:relative;
  }
  .secao-titulo{
    font-family:var(--fd); font-weight:800; font-size:21px; line-height:1.1;
    margin:22px 4px 10px; display:flex; align-items:center; gap:4px 8px; flex-wrap:wrap;
  }
  .secao-titulo small{font-family:var(--fb); font-size:12.5px; font-weight:800; color:var(--muted); margin-left:auto;}
  .texto-ajuda{font-size:14px; font-weight:700; color:var(--ink-2); line-height:1.45; margin:0 0 12px;}

  .btn{
    --sh:var(--line);
    border:0; border-radius:16px;
    padding:12px 16px; min-height:52px;
    font-family:var(--fb); font-weight:900; font-size:16px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; text-decoration:none; position:relative;
    box-shadow:0 4px 0 var(--sh);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:not(:disabled):active{transform:translateY(3px); box-shadow:0 1px 0 var(--sh);}
  .btn:disabled{opacity:0.4; cursor:default; box-shadow:none;}
  .btn-primario{--sh:var(--violeta-shade); background:linear-gradient(180deg, var(--violeta-2), var(--violeta)); color:#fff;}
  .btn-sol{--sh:var(--sol-shade); background:linear-gradient(180deg, var(--sol-2), var(--sol)); color:#3D2E00;}
  .btn-menta{--sh:var(--menta-shade); background:linear-gradient(180deg, var(--menta-2), var(--menta)); color:#fff;}
  .btn-coral{--sh:var(--coral-shade); background:linear-gradient(180deg, #FF7A8A, var(--coral)); color:#fff;}
  .btn-claro{--sh:#D9D7EE; background:#fff; color:var(--ink); border:2px solid var(--line);}
  .btn-bloco{width:100%;}
  .btn-sm{min-height:44px; padding:8px 14px; font-size:14.5px; border-radius:13px;}

  .voltar{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-radius:99px;
    padding:0 14px 0 10px; height:44px; font-weight:900; font-size:14px; margin-bottom:12px;
    box-shadow:0 2px 0 var(--line); color:var(--ink);
  }
  .voltar:active{transform:translateY(2px); box-shadow:none;}
  .voltar-ic{
    width:44px; height:44px; flex-shrink:0; border-radius:14px; border:1.5px solid var(--line);
    background:#fff; font-size:20px; font-weight:900; cursor:pointer; box-shadow:0 2px 0 var(--line); color:var(--ink);
  }
  .voltar-ic:active{transform:translateY(2px); box-shadow:none;}

  /* ---------- AVATAR DOS PERSONAGENS ---------- */
  .avatar{
    width:56px; height:56px; border-radius:50%; margin:0 auto; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow:0 0 0 3px #fff, 0 4px 10px rgba(30,27,75,0.18);
  }

  /* ---------- HERO (boas-vindas) ---------- */
  .hero{
    position:relative; overflow:hidden; color:#fff;
    border-radius:26px; padding:18px 18px 16px; margin-bottom:14px;
    background:linear-gradient(135deg, #7A5CFF 0%, #5B3FE6 55%, #3E2BC2 100%);
    box-shadow:0 14px 34px rgba(91,63,230,0.35);
  }
  .hero::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 88% 12%, rgba(255,255,255,0.22), transparent 40%),
      radial-gradient(circle at 6% 115%, rgba(255,197,61,0.40), transparent 40%);
  }
  .hero-row{display:flex; gap:14px; align-items:center; position:relative;}
  .hero-avatar{
    width:68px; height:68px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(180deg, #FFE08A, #FFC53D);
    display:grid; place-items:center; font-size:36px;
    box-shadow:0 0 0 4px rgba(255,255,255,0.35), 0 8px 18px rgba(0,0,0,0.22);
  }
  .hero-info{flex:1; min-width:0;}
  .hero-ola{font-family:var(--fd); font-weight:800; font-size:24px; line-height:1.05; padding-right:92px;}
  .hero-nivel{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13.5px; font-weight:800;}
  .nivel-badge{background:rgba(255,255,255,0.2); border:1.5px solid rgba(255,255,255,0.45); padding:2px 9px; border-radius:99px;}
  .xp-trilho{height:12px; border-radius:99px; background:rgba(0,0,0,0.28); margin-top:9px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,0.3);}
  .xp-barra{height:100%; border-radius:99px; background:linear-gradient(90deg, #FFD766, #FFB020); box-shadow:0 0 12px rgba(255,199,61,0.7); transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .xp-meta{font-size:12.5px; font-weight:800; opacity:0.92; margin-top:5px;}
  .hero-trocar{
    position:absolute; top:12px; right:12px; z-index:1;
    background:rgba(255,255,255,0.16); color:#fff; border:1.5px solid rgba(255,255,255,0.4);
    border-radius:99px; padding:0 11px; height:32px; font-weight:900; font-size:12.5px; cursor:pointer;
  }
  .hero-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; position:relative;}
  .stat{
    background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.24);
    border-radius:14px; padding:9px 6px; text-align:center; color:#fff; cursor:default; font-family:var(--fb);
  }
  button.stat{cursor:pointer;}
  button.stat:active{background:rgba(255,255,255,0.26);}
  .stat b{display:block; font-family:var(--fd); font-size:20px; line-height:1;}
  .stat span{font-size:11.5px; font-weight:800; opacity:0.92; display:block; margin-top:2px;}

  /* ---------- MISSÃO DO DIA ---------- */
  .missao{display:flex; align-items:center; gap:14px; padding:14px 16px;}
  .anel{
    --p:0; width:66px; height:66px; border-radius:50%; flex-shrink:0; position:relative;
    background:conic-gradient(var(--menta) calc(var(--p) * 1%), #ECEBF8 0);
    display:grid; place-items:center;
  }
  .anel::after{content:""; position:absolute; inset:7px; background:#fff; border-radius:50%;}
  .anel b{position:relative; z-index:1; font-family:var(--fd); font-size:19px; line-height:1;}
  .anel b small{font-size:11px; font-weight:800; color:var(--muted);}
  .missao.feita .anel{background:var(--menta);}
  .missao.feita .anel b{color:var(--menta-esc);}
  .missao-txt{flex:1; min-width:0;}
  .missao-txt b{display:block; font-family:var(--fd); font-size:18px; line-height:1.1;}
  .missao-txt small{display:block; font-size:13.5px; font-weight:800; color:var(--ink-2); margin-top:3px;}

  .atalhos{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .atalho{
    display:flex; align-items:center; gap:10px; text-align:left;
    background:#fff; border:1.5px solid var(--line); border-radius:16px;
    padding:10px 12px; cursor:pointer; box-shadow:0 3px 0 var(--line); color:var(--ink);
  }
  .atalho:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
  .a-ic{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:22px; flex-shrink:0;}
  .atalho b{display:block; font-size:14.5px; font-weight:900; line-height:1.15;}
  .atalho small{font-size:12px; font-weight:800; color:var(--muted);}

  /* ---------- PRÓXIMO DESAFIO ---------- */
  .proximo{
    border-radius:var(--raio); border:1.5px solid var(--line);
    box-shadow:var(--sombra-s); overflow:hidden; margin-bottom:14px; background:#fff;
  }
  .proximo-topo{padding:14px 16px; color:#fff; display:flex; align-items:center; gap:12px; position:relative; overflow:hidden;}
  .proximo-topo::after{content:""; position:absolute; right:-30px; top:-40px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.14);}
  .proximo-contagem{
    background:#fff; color:var(--ink); border-radius:16px; position:relative; z-index:1;
    min-width:70px; padding:7px 8px; text-align:center; flex-shrink:0; box-shadow:0 4px 10px rgba(0,0,0,0.18);
  }
  .proximo-contagem b{display:block; font-family:var(--fd); font-size:30px; line-height:1;}
  .proximo-contagem span{font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-2);}
  .proximo-info{position:relative; z-index:1; min-width:0;}
  .proximo-rotulo{font-size:11.5px; font-weight:900; letter-spacing:1px; text-transform:uppercase; opacity:0.95;}
  .proximo-titulo{font-family:var(--fd); font-weight:800; font-size:18.5px; line-height:1.15; margin-top:2px;}
  .proximo-data{font-size:13.5px; font-weight:800; margin-top:3px; opacity:0.95;}
  .proximo-corpo{padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px;}
  .proximo-btns{display:flex; flex-wrap:wrap; gap:8px;}
  .proximo-btns .btn{flex:1 1 180px;}

  /* fala de personagem */
  .fala{display:flex; gap:10px; align-items:flex-end;}
  .fala .avatar{width:48px; height:48px; font-size:24px; margin:0;}
  .balao{
    --bc:var(--line-2);
    flex:1; min-width:0; position:relative;
    background:#fff; border:2px solid var(--bc); border-radius:18px 18px 18px 6px;
    padding:10px 13px; font-size:15px; font-weight:800; line-height:1.4;
  }
  .balao::before{
    content:""; position:absolute; left:-8px; bottom:14px; width:12px; height:12px;
    background:#fff; border-left:2px solid var(--bc); border-bottom:2px solid var(--bc);
    transform:rotate(45deg);
  }
  .balao b{display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin-bottom:2px;}

  /* ---------- CALENDÁRIO ---------- */
  .cal{padding:14px 12px 14px;}
  .cal-cab{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .cal-mes{font-family:var(--fd); font-weight:800; font-size:22px; text-transform:capitalize; text-align:center; flex:1; line-height:1;}
  .cal-mes small{display:block; font-family:var(--fb); font-size:12px; font-weight:800; color:var(--muted); text-transform:none; margin-top:4px;}
  .cal-nav{
    width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; font-size:20px; font-weight:900; cursor:pointer; box-shadow:0 2px 0 var(--line); color:var(--ink);
  }
  .cal-nav:disabled{opacity:0.3; cursor:default;}
  .cal-nav:not(:disabled):active{transform:translateY(2px); box-shadow:none;}
  .cal-grade{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px;}
  .cal-sem{text-align:center; font-size:11px; font-weight:900; color:var(--muted); padding:2px 0 6px; letter-spacing:0.5px;}
  .cal-dia{
    min-height:56px; border-radius:12px; border:1.5px solid var(--line);
    background:#FBFBFF; padding:4px; display:flex; flex-direction:column; gap:3px;
    text-align:left; position:relative; font-family:var(--fb); color:var(--ink);
  }
  .cal-dia.vazio{background:transparent; border-color:transparent;}
  .cal-dia.fds{background:#F3F3FB;}
  .cal-dia.passado{opacity:0.5;}
  .cal-dia.tem{cursor:pointer; background:#fff; box-shadow:0 2px 0 var(--line);}
  .cal-dia.tem:active{transform:translateY(2px); box-shadow:none;}
  .cal-dia.hoje{border-color:var(--violeta); box-shadow:0 0 0 3px rgba(108,77,255,0.18); opacity:1;}
  .cal-dia.sel{border-color:var(--sol-esc); background:#FFF6D6; box-shadow:0 0 0 3px rgba(255,197,61,0.35); opacity:1;}
  .cal-num{font-size:12.5px; font-weight:900; line-height:1; color:var(--ink-2); padding:1px 2px;}
  .cal-dia.hoje .cal-num{color:var(--violeta);}
  .cal-hoje-tag{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    background:var(--violeta); color:#fff; white-space:nowrap;
    font-size:9px; font-weight:900; padding:2px 6px; border-radius:99px; letter-spacing:0.3px;
  }
  .chip{
    display:flex; align-items:center; justify-content:center; gap:3px;
    border-radius:7px; padding:2px 3px; font-size:11px; font-weight:900; line-height:1.2;
    color:#fff; min-height:19px; max-width:100%; overflow:hidden; white-space:nowrap;
  }
  .chip .chip-txt{display:none; overflow:hidden; text-overflow:ellipsis;}
  .tipo-sistematizada{background:var(--t-sistematizada); color:#fff;}
  .tipo-avaliacao{background:var(--t-avaliacao); color:#fff;}
  .tipo-atividade{background:var(--t-atividade); color:#fff;}
  .tipo-trabalho{background:var(--t-trabalho); color:#fff;}
  .tipo-entrega{background:var(--t-entrega); color:#2B1A00;}
  .tipo-evento{background:var(--t-evento); color:#fff;}
  .tipo-feriado{background:var(--t-feriado); color:#1E1B4B;}

  .legenda{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .legenda .chip{padding:5px 9px; font-size:12px; border-radius:99px;}
  .legenda .chip .chip-txt{display:inline;}

  .dia-detalhe{margin-top:12px; border-top:2px dashed var(--line); padding-top:12px;}
  .dd-titulo{font-family:var(--fd); font-weight:800; font-size:18px; margin-bottom:8px;}
  .evento{border-radius:16px; border:1.5px solid var(--line); overflow:hidden; margin-bottom:10px; background:#fff; box-shadow:0 2px 0 var(--line);}
  .evento-faixa{padding:8px 12px; font-size:12px; font-weight:900; letter-spacing:0.6px; text-transform:uppercase; display:flex; justify-content:space-between; gap:8px;}
  .evento-corpo{padding:10px 12px 12px;}
  .evento-titulo{font-weight:900; font-size:15.5px; line-height:1.3;}
  .evento-detalhe{font-size:13.5px; font-weight:800; color:var(--ink-2); margin-top:3px;}
  .evento-materias{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .mat-pill{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    border:1.5px solid var(--line); border-radius:99px; padding:0 14px 0 10px; height:44px;
    background:#fff; font-weight:900; font-size:14px; box-shadow:0 3px 0 var(--line); color:var(--ink);
  }
  .mat-pill:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
  .mat-pill .bolinha{width:12px; height:12px; border-radius:50%;}

  .agenda-item{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#fff; border:1.5px solid var(--line); border-radius:16px;
    padding:10px 12px; margin-bottom:10px; cursor:pointer; box-shadow:0 3px 0 var(--line); color:var(--ink);
  }
  .agenda-item:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
  .agenda-data{width:54px; flex-shrink:0; text-align:center; border-radius:12px; padding:6px 0;}
  .agenda-data b{display:block; font-family:var(--fd); font-size:23px; line-height:1;}
  .agenda-data span{font-size:11px; font-weight:900; text-transform:uppercase;}
  .agenda-txt{flex:1; min-width:0;}
  .agenda-txt b{display:block; font-size:14.5px; font-weight:900; line-height:1.25;}
  .agenda-txt small{font-size:12.5px; font-weight:800; color:var(--ink-2);}
  .agenda-falta{font-size:12px; font-weight:900; background:#F3F2FF; border-radius:99px; padding:5px 9px; white-space:nowrap; color:var(--violeta-esc);}

  /* ---------- MATÉRIAS ---------- */
  .materias{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .mat-tile{
    --c:var(--violeta);
    position:relative; text-align:left; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-radius:var(--raio);
    box-shadow:var(--sombra-s); padding:0; overflow:hidden; display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease; color:var(--ink);
  }
  .mat-tile:active{transform:scale(0.97);}
  .mat-topo{
    height:72px; position:relative; background:var(--c);
    background:linear-gradient(135deg, color-mix(in srgb, var(--c) 72%, white), var(--c));
  }
  .mat-topo::after{content:""; position:absolute; right:-20px; bottom:-30px; width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,0.18);}
  .mat-ic{
    position:absolute; left:12px; bottom:-18px; width:52px; height:52px; border-radius:16px;
    background:#fff; display:grid; place-items:center; font-size:27px;
    box-shadow:0 4px 12px rgba(30,27,75,0.16);
  }
  .lingua{position:absolute; top:10px; right:10px; font-size:10.5px; font-weight:900; background:rgba(255,255,255,0.92); color:var(--ink); border-radius:99px; padding:3px 8px;}
  .mat-corpo{padding:24px 12px 12px; display:flex; flex-direction:column; gap:5px; flex:1;}
  .mat-nome{font-family:var(--fd); font-weight:800; font-size:17px; line-height:1.1;}
  .estrelas{font-size:15px; letter-spacing:1px; line-height:1;}
  .estrelas .off{filter:grayscale(1); opacity:0.28;}
  .mat-prox{margin-top:auto; font-size:11.5px; font-weight:900; border-radius:8px; padding:4px 7px; align-self:flex-start;}
  .mat-prox.nada{background:#F3F2FF; color:var(--muted);}

  /* ---------- TELA DA MATÉRIA ---------- */
  .mat-hero{
    --c:var(--violeta);
    border-radius:26px; color:#fff; padding:18px; margin-bottom:14px; position:relative; overflow:hidden;
    background:var(--c);
    background:linear-gradient(135deg, color-mix(in srgb, var(--c) 78%, white), var(--c) 60%, color-mix(in srgb, var(--c) 80%, black));
    box-shadow:0 14px 30px color-mix(in srgb, var(--c) 40%, transparent);
  }
  .mat-hero::after{content:""; position:absolute; right:-40px; bottom:-70px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,0.14);}
  .mh-ic{width:64px; height:64px; border-radius:18px; background:rgba(255,255,255,0.95); display:grid; place-items:center; font-size:36px; box-shadow:0 6px 14px rgba(0,0,0,0.18);}
  .mat-hero h2{font-family:var(--fd); font-weight:800; font-size:28px; line-height:1; margin:12px 0 6px; position:relative;}
  .mat-hero p{margin:0; font-weight:800; font-size:14px; line-height:1.4; opacity:0.95; position:relative;}
  .mat-hero .estrelas{margin-top:10px; font-size:22px; position:relative;}
  .modos{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:6px;}
  .modo{
    display:flex; align-items:center; gap:14px; text-align:left; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-radius:18px;
    padding:12px 14px; box-shadow:0 3px 0 var(--line); color:var(--ink);
  }
  .modo:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
  .modo-ic{width:50px; height:50px; border-radius:14px; flex-shrink:0; display:grid; place-items:center; font-size:26px;}
  .modo b{display:block; font-size:16.5px; font-weight:900;}
  .modo small{font-size:13px; font-weight:800; color:var(--ink-2);}
  .modo .seta{margin-left:auto; font-size:22px; font-weight:900; color:var(--muted);}
  .temas{display:flex; flex-direction:column; gap:8px;}
  .tema-linha{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:10px 12px;
    font-weight:900; font-size:15px; min-height:48px; color:var(--ink); box-shadow:0 2px 0 var(--line);
  }
  .tema-linha:active{transform:translateY(2px); box-shadow:none;}
  .tema-linha small{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; font-weight:900;}
  .tema-num{width:28px; height:28px; border-radius:9px; background:var(--c, var(--violeta)); color:#fff; display:grid; place-items:center; font-size:13px; flex-shrink:0;}

  /* ---------- LIÇÕES ---------- */
  .licao-topo{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .licao-topo .progresso{flex:1;}
  .licao{--c:var(--violeta);}
  .licao h3{font-family:var(--fd); font-weight:800; font-size:23px; line-height:1.12; margin:8px 0 10px;}
  .licao p{font-size:16.5px; font-weight:700; line-height:1.5; margin:0 0 12px;}
  .licao ol{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; counter-reset:p;}
  .licao li{
    position:relative; background:#F7F6FF; border:1.5px solid #E7E5F8; border-radius:14px;
    padding:10px 12px 10px 46px; font-size:15.5px; font-weight:700; line-height:1.45;
  }
  .licao li::before{
    counter-increment:p; content:counter(p);
    position:absolute; left:11px; top:10px; width:25px; height:25px; border-radius:8px;
    background:var(--c); color:#fff; font-weight:900; font-size:13px; display:grid; place-items:center;
  }
  .licao em, .pergunta em, .explica em, .balao em{font-style:normal; background:#FFF1BF; border-radius:6px; padding:0 4px; box-decoration-break:clone; -webkit-box-decoration-break:clone;}
  .tag-tema{
    display:inline-block; font-size:11.5px; font-weight:900; letter-spacing:0.7px; text-transform:uppercase;
    padding:5px 10px; border-radius:99px; color:#fff;
  }
  .licao .fala{margin-top:16px;}

  /* ---------- JOGO ---------- */
  .jogo-topo{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .progresso{flex:1; height:14px; background:#E6E5F5; border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(30,27,75,0.08);}
  .progresso-barra{height:100%; background:linear-gradient(90deg, var(--menta-2), var(--menta)); border-radius:99px; transition:width .35s ease;}
  .contador{font-weight:900; font-size:13.5px; white-space:nowrap; color:var(--ink-2);}
  .combo{display:inline-flex; align-items:center; gap:4px; background:#fff; border:1.5px solid var(--line); border-radius:99px; padding:0 9px; height:32px; font-weight:900; font-size:13.5px;}
  .combo.quente{background:#FFE3B0; border-color:#FFC53D; animation:pulsa .6s ease;}
  .faixa-modo{
    background:linear-gradient(180deg, #FF7A8A, var(--coral)); color:#fff; border-radius:14px;
    padding:9px 12px; font-weight:900; font-size:14px; text-align:center; margin-bottom:12px; box-shadow:0 3px 0 var(--coral-shade);
  }
  .faixa-modo.tema{background:linear-gradient(180deg, var(--violeta-2), var(--violeta)); box-shadow:0 3px 0 var(--violeta-shade);}
  .veiculo{
    display:flex; align-items:center; gap:12px; color:#fff;
    background:linear-gradient(135deg, #2E2A75, var(--ink)); border-radius:16px; padding:10px 14px; margin-bottom:12px;
    box-shadow:var(--sombra-s);
  }
  .veiculo-ic{font-size:28px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3));}
  .veiculo-ic.evoluiu{animation:evolui .8s ease;}
  @keyframes evolui{0%{transform:scale(1);}35%{transform:scale(1.6) rotate(-10deg);}65%{transform:scale(1.6) rotate(10deg);}100%{transform:scale(1);}}
  .veiculo-info{flex:1; min-width:0;}
  .veiculo-nome{font-weight:900; font-size:14.5px;}
  .veiculo-trilho{height:9px; border-radius:99px; background:rgba(255,255,255,0.18); margin-top:5px; overflow:hidden;}
  .veiculo-barra{height:100%; background:linear-gradient(90deg, #FFD766, #FFB020); border-radius:99px; transition:width .4s ease;}
  .veiculo-sub{font-size:12.5px; font-weight:800; color:#C9C6F0; margin-top:5px;}
  .evoluiu-banner{
    background:linear-gradient(180deg, var(--sol-2), var(--sol)); color:#3D2E00; border-radius:14px;
    padding:9px 12px; text-align:center; font-weight:900; margin-bottom:10px; animation:cai .4s ease; box-shadow:0 3px 0 var(--sol-shade);
  }
  @keyframes cai{from{opacity:0; transform:translateY(-10px);}to{opacity:1; transform:none;}}

  .host{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .host .avatar{width:44px; height:44px; font-size:22px; margin:0;}
  .host-txt{font-weight:900; font-size:14.5px;}
  .host-txt small{display:block; font-size:12px; color:var(--muted); font-weight:800;}
  .pergunta{font-family:var(--fd); font-weight:700; font-size:21px; line-height:1.3; margin:8px 0 14px;}
  .opcoes{display:flex; flex-direction:column; gap:10px;}
  .opcao{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    background:#fff; border:2px solid var(--line-2); border-radius:16px; color:var(--ink);
    padding:10px 12px; font-weight:800; font-size:16px; line-height:1.3; min-height:54px;
    box-shadow:0 3px 0 var(--line); transition:transform .08s ease;
  }
  .opcao:not([disabled]):active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
  .opcao[disabled]{cursor:default;}
  .letra{width:32px; height:32px; border-radius:10px; flex-shrink:0; display:grid; place-items:center; font-weight:900; font-size:14px; color:#fff;}
  .letra.l0{background:var(--violeta);} .letra.l1{background:var(--ceu);}
  .letra.l2{background:var(--menta-esc);} .letra.l3{background:var(--coral);}
  .letra.l4{background:var(--sol-esc);}
  .opcao.certa{background:#E7FBF2; border-color:var(--menta); box-shadow:0 3px 0 var(--menta-esc);}
  .opcao.certa .letra{background:var(--menta-esc);}
  .opcao.errada{background:#FFECEF; border-color:var(--coral); box-shadow:0 3px 0 var(--coral-esc);}
  .opcao.errada .letra{background:var(--coral-esc);}
  .opcao.apagada{opacity:0.45;}
  .marca-resp{margin-left:auto; font-size:18px; font-weight:900; flex-shrink:0;}
  .opcao.certa .marca-resp{color:var(--menta-esc);}
  .opcao.errada .marca-resp{color:var(--coral-esc);}
  .card.treme{animation:treme .45s ease;}
  @keyframes treme{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
  @keyframes pulsa{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
  .retorno{
    margin-top:12px; border-radius:16px; padding:12px 14px; scroll-margin-bottom:110px;
    font-size:15.5px; font-weight:700; line-height:1.45; animation:cai .3s ease;
    display:flex; gap:10px; align-items:flex-start;
  }
  .retorno .avatar{width:40px; height:40px; font-size:20px; margin:0;}
  .retorno.ok{background:#E7FBF2; border:1.5px solid #B6EFD6;}
  .retorno.nao{background:#FFF4E5; border:1.5px solid #FFDFB0;}
  .retorno b{display:block; font-family:var(--fd); font-size:18px; font-weight:800; margin-bottom:1px;}
  .nav-jogo{display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:10px; margin-top:16px;}

  .xp-voa{
    position:fixed; z-index:50; pointer-events:none; font-family:var(--fd); font-weight:800; font-size:26px;
    color:var(--menta-esc); text-shadow:0 2px 0 #fff; animation:voa 1s ease forwards;
  }
  @keyframes voa{from{opacity:1; transform:translate(-50%,0);}to{opacity:0; transform:translate(-50%,-70px);}}
  .confete{position:fixed; top:-12px; width:10px; height:14px; z-index:60; pointer-events:none; border-radius:2px; animation:confete 1.6s ease-in forwards;}
  @keyframes confete{to{transform:translateY(105vh) rotate(720deg);}}
  .toast{
    position:fixed; left:50%; top:14px; z-index:80; max-width:calc(100% - 32px);
    transform:translate(-50%,-30px); opacity:0; transition:transform .3s ease, opacity .3s ease;
    background:var(--ink); color:#fff; padding:11px 16px; border-radius:14px; font-weight:900; font-size:15px;
    box-shadow:var(--sombra-m); text-align:center;
  }
  .toast.on{transform:translate(-50%,0); opacity:1;}

  /* ---------- FLASHCARDS ---------- */
  .flash{min-height:230px; cursor:pointer; display:flex; flex-direction:column; width:100%; text-align:left; font:inherit; color:var(--ink);}
  .flash .virar{margin-top:auto; text-align:center; font-weight:900; color:var(--ink-2); background:#F7F6FF; border-radius:12px; padding:12px;}
  .resposta{background:linear-gradient(180deg, var(--menta-2), var(--menta)); color:#fff; border-radius:14px; padding:10px 14px; margin-bottom:10px; box-shadow:0 3px 0 var(--menta-shade);}
  .resposta small{font-size:11.5px; font-weight:900; letter-spacing:1px; text-transform:uppercase;}
  .resposta .rt{display:block; font-size:19px; font-weight:900; margin-top:2px;}
  .explica{font-size:15.5px; font-weight:700; line-height:1.45; background:#FFF6D6; border-radius:12px; padding:10px 12px;}

  /* ---------- FIM ---------- */
  .fim{text-align:center; padding:22px 18px;}
  .fim-estrelas{font-size:52px; letter-spacing:4px; margin:0 0 4px; line-height:1;}
  .fim-estrelas span{display:inline-block; animation:estrela .6s ease backwards;}
  .fim-estrelas span:nth-child(2){animation-delay:.25s;}
  .fim-estrelas span:nth-child(3){animation-delay:.5s;}
  .fim-estrelas .off{filter:grayscale(1); opacity:0.22;}
  @keyframes estrela{from{transform:scale(0) rotate(-90deg);}70%{transform:scale(1.3);}to{transform:scale(1);}}
  .fim h2{font-family:var(--fd); font-weight:800; font-size:28px; margin:4px 0;}
  .placar{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0;}
  .placar div{background:#F7F6FF; border:1.5px solid var(--line); border-radius:14px; padding:10px 6px;}
  .placar b{display:block; font-family:var(--fd); font-size:24px; line-height:1;}
  .placar span{font-size:11.5px; font-weight:900; color:var(--muted);}
  .fim p{font-weight:800; font-size:15.5px; line-height:1.45;}
  .acoes{display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px;}

  .novos-carimbos{background:#FFF6D6; border:1.5px solid #FFE08A; border-radius:16px; padding:12px; margin:12px 0; text-align:left;}
  .novos-carimbos .nc-tit{font-family:var(--fd); font-weight:800; font-size:18px; text-align:center;}
  .nc-item{display:flex; gap:10px; align-items:center; padding:6px 0; font-weight:800;}
  .nc-item span:first-child{font-size:30px;}
  .nc-item small{color:var(--ink-2); font-weight:700;}

  .mapa{text-align:left;}
  .mapa-linha{border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px; background:#fff;}
  .mapa-topo{display:flex; justify-content:space-between; gap:8px; font-weight:900; font-size:15px;}
  .mapa-trilho{height:10px; background:#E6E6F5; border-radius:99px; margin-top:7px; overflow:hidden;}
  .mapa-barra{height:100%; border-radius:99px;}
  .mapa-linha.forte .mapa-barra{background:var(--menta);}
  .mapa-linha.medio .mapa-barra{background:var(--sol);}
  .mapa-linha.fraco .mapa-barra{background:var(--coral);}
  .mapa-btn{margin-top:8px; width:100%; border:0; border-radius:10px; background:var(--violeta); color:#fff; font-weight:900; padding:9px; cursor:pointer; min-height:44px; box-shadow:0 3px 0 var(--violeta-shade);}
  .mapa-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--violeta-shade);}
  .revisao{text-align:left; max-height:280px; overflow:auto; border:1.5px solid var(--line); border-radius:14px; padding:4px 12px; background:#fff;}
  .rv{display:flex; gap:10px; padding:9px 0; border-bottom:1.5px solid #EEEDF8; font-size:14.5px; font-weight:700; line-height:1.35;}
  .rv:last-child{border-bottom:none;}
  .rv-m{font-weight:900; font-size:17px; flex-shrink:0;}
  .rv-m.ok{color:var(--menta-esc);} .rv-m.no{color:var(--coral-esc);}

  /* ---------- PASSAPORTE (CARIMBOS) ---------- */
  .resumo{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .resumo div{background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:10px 6px; text-align:center; box-shadow:0 3px 0 var(--line);}
  .resumo b{display:block; font-family:var(--fd); font-size:26px; line-height:1; color:var(--violeta);}
  .resumo span{font-size:11.5px; font-weight:900; color:var(--muted);}
  .carimbos{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .carimbo{background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:12px 10px; text-align:center;}
  .carimbo.ganho{background:#FFF6D6; border:2px dashed #E0A400; transform:rotate(-1.5deg);}
  .carimbo.ganho:nth-child(even){transform:rotate(1.5deg);}
  .carimbo.bloq{background:#F3F2FA;}
  .carimbo.bloq .cb-ic{filter:grayscale(1); opacity:0.3;}
  .cb-ic{font-size:36px; line-height:1;}
  .cb-nome{font-family:var(--fd); font-weight:800; font-size:15.5px; margin-top:4px;}
  .cb-desc{font-size:12.5px; font-weight:700; color:var(--ink-2); line-height:1.3; margin-top:2px;}

  /* ---------- PERFIS ---------- */
  .perfil{display:flex; gap:8px; margin-bottom:10px;}
  .perfil-btn{
    flex:1; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:10px 12px; box-shadow:0 3px 0 var(--line); color:var(--ink);
  }
  .perfil.ativo .perfil-btn{background:#E7FBF2; border-color:#B6EFD6;}
  .perfil-btn .avatar{width:48px; height:48px; font-size:24px; margin:0; background:linear-gradient(180deg, #FFE08A, #FFC53D);}
  .perfil-nome{font-family:var(--fd); font-weight:800; font-size:20px; line-height:1.1;}
  .perfil-nome small{display:block; font-family:var(--fb); font-size:12.5px; color:var(--menta-esc); font-weight:900;}
  .perfil-del{width:52px; border:1.5px solid var(--line); border-radius:16px; background:#fff; font-size:20px; cursor:pointer; box-shadow:0 3px 0 var(--line);}
  .campo{width:100%; padding:12px 14px; border:2px solid var(--line-2); border-radius:14px; font:800 17px var(--fb); margin:6px 0 12px; color:var(--ink); background:#fff;}
  .rotulo{font-weight:900; font-size:14px;}
  .icones{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:14px;}
  .icone-op{font-size:24px; padding:6px 0; border:2px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; min-height:44px;}
  .icone-op.sel{border-color:var(--sol-esc); background:#FFF6D6;}
  .aviso{background:#FFECEF; border:1.5px solid #FFB8C2; border-radius:16px; padding:12px 14px; margin-bottom:14px;}
  .aviso b{display:block; color:var(--coral-esc); margin-bottom:4px;}
  .aviso span{font-size:14px; font-weight:700; line-height:1.45;}

  /* ---------- RODAPÉ ALARIS IA ---------- */
  .rodape{margin-top:34px; text-align:center;}
  .alaris{
    display:inline-flex; align-items:center; gap:12px;
    background:linear-gradient(135deg, #141A2E, #0B0F1C); color:#fff; border-radius:18px; padding:12px 18px;
    box-shadow:var(--sombra-m);
  }
  .alaris svg{width:60px; height:40px; flex-shrink:0;}
  .alaris-txt{text-align:left; line-height:1;}
  .alaris-txt small{display:block; font-size:10.5px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:#B7BCCD; margin-bottom:4px;}
  .alaris-txt b{font-family:'Montserrat', var(--fb); font-weight:800; font-size:22px; letter-spacing:-0.3px;}
  .alaris-txt b span{color:#A79FFF;}
  .rodape-sub{font-size:12.5px; font-weight:800; color:var(--muted); margin-top:12px; line-height:1.6;}

  /* ---------- SELO DE VERSÃO ---------- */
  .versao-selo{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:12px; padding:7px 14px;
    background:#141A2E; color:#E8EAF2;
    border:2px solid #2B3450; border-radius:999px;
    font-family:var(--fb); font-size:12.5px; font-weight:800;
    cursor:pointer; transition:transform .12s ease, border-color .15s ease;
  }
  .versao-selo:hover{border-color:#6F63FF;}
  .versao-selo:active{transform:scale(0.97);}
  .versao-rotulo{
    font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:#8E97B4;
  }

function diasAte(iso){ return Math.round((paraData(iso) - hoje()) / 86400000); }

function dataLonga(iso){
  const d = paraData(iso);
  const t = `${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
  return t.charAt(0).toUpperCase() + t.slice(1);
}

  const n = diasAte(iso);

}

// =========================================================
//  SOM — a trilha reage ao desempenho
//
//  Nada de arquivos de áudio: tudo é sintetizado no próprio navegador,
//  então o jogo continua sendo um arquivo só e funcionando offline.
//
//  A ideia central é que o acerto NÃO toque sempre a mesma nota. Ela
//  sobe numa escala conforme a sequência de acertos cresce, como as
//  moedas de um jogo de plataforma. A criança escuta que está indo
//  bem antes mesmo de ler o retorno na tela — e escuta a queda quando
//  erra e a sequência zera. O som vira placar.
// =========================================================
const SOM_KEY = 'passaporte-som-v1';
let somLigado = (function(){ try{ return localStorage.getItem(SOM_KEY) !== '0'; }catch(e){ return true; } })();
let audioCtx = null, somMaster = null;

/** Prepara (ou destrava) o áudio. Navegadores só liberam som depois do primeiro toque. */
function audio(){
  if(!somLigado) return null;
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      somMaster = audioCtx.createGain();
      somMaster.gain.value = 0.9;
      // compressor suave: várias camadas ao mesmo tempo não estouram
      // no alto-falante pequeno do Chromebook ou do tablet
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      comp.attack.value = 0.003; comp.release.value = 0.25;
      somMaster.connect(comp); comp.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}

/**
 * Uma nota com corpo: fundamental mais um harmônico uma oitava acima,
 * com ataque curto no lugar do estalo e cauda que decai sozinha.
 * É o que separa "bipe de micro-ondas" de "sininho".
 */
function nota(freq, inicio, dur, opc){
  const ctx = audioCtx; if(!ctx) return;
  const o = opc || {};
  const vol = o.vol == null ? 0.22 : o.vol;
  const t = ctx.currentTime + inicio;

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + (o.ataque || 0.012));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(somMaster);

  const base = ctx.createOscillator();
  base.type = o.tipo || 'triangle';
  base.frequency.setValueAtTime(freq, t);
  if(o.glide) base.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
  base.connect(g); base.start(t); base.stop(t + dur + 0.02);

  // brilho: oitava acima e bem mais baixa — dá o "sino" sem pesar
  if(o.brilho !== false){
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol * 0.3, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.7);
    g2.connect(somMaster);
    const alt = ctx.createOscillator();
    alt.type = 'sine';
    alt.frequency.setValueAtTime(freq * 2, t);
    alt.connect(g2); alt.start(t); alt.stop(t + dur * 0.7 + 0.02);
  }
}

function frase(notas){
  if(!audio()) return;
  notas.forEach(n => nota(n[0], n[1], n[2], n[3]));
}

/** Vibração curta no celular/tablet. No Chromebook o navegador ignora sem erro. */
function vibrar(padrao){
  try{ if(navigator.vibrate && !reduzMovimento) navigator.vibrate(padrao); }catch(e){}
}

// Escala pentatônica maior de dó: não existe combinação feia dentro dela,
// então a sequência sobe sempre soando bem, por mais longa que fique.
const ESCALA = [523.25, 587.33, 659.25, 783.99, 880.00,
                1046.50, 1174.66, 1318.51, 1567.98, 1760.00];

/**
 * Acerto. Quanto maior a sequência, mais aguda a nota — e nos marcos
 * (3, 5, 10 e de 5 em 5) entra um arremate por cima.
 */
const VOLTA = 8;   // degraus da escala antes de recomeçar

function somAcerto(seq){
  if(!audio()) return;
  const n = Math.max(1, seq || 1);
  const ciclo = Math.floor((n - 1) / VOLTA);   // quantas voltas já deu
  const passo = (n - 1) % VOLTA;
  const f = ESCALA[passo];

  frase([
    [f,       0,    0.16, {vol: 0.20}],
    [f * 1.5, 0.07, 0.22, {vol: 0.16}]   // a quinta acima: soa "resolvido"
  ]);

  // Em vez de subir para sempre — o que vira apito e cansa o ouvido —
  // a melodia volta ao começo a cada 8 acertos, mas ganha um grave novo
  // por baixo. Soa mais encorpada a cada volta, não mais aguda.
  if(ciclo > 0){
    frase([[ciclo === 1 ? 261.63 : 130.81, 0, 0.38,
            {vol: 0.13, tipo: 'sine', brilho: false}]]);
  }

  const marco = n === 3 || n === 5 || n === 10 || (n > 10 && n % 5 === 0);
  if(marco){
    frase([
      [ESCALA[passo + 1] || 1760,                       0.17, 0.12, {vol: 0.14, tipo: 'sine'}],
      [ESCALA[Math.min(passo + 2, ESCALA.length - 1)],  0.25, 0.28, {vol: 0.16, tipo: 'sine'}]
    ]);
    vibrar([18, 40, 26]);
  } else {
    vibrar(14);
  }
}

/**
 * Erro. Suave de propósito: dois tons descendo, sem onda quadrada e sem
 * brilho. Erro não é punição — é o que mostra o que estudar.
 */
function somErro(){
  frase([
    [330, 0,    0.14, {vol: 0.13, tipo: 'sine', brilho: false}],
    [247, 0.09, 0.26, {vol: 0.13, tipo: 'sine', brilho: false, glide: 233}]
  ]);
  vibrar(28);
}

/** Fim de rodada: o tamanho da fanfarra depende da nota que a criança tirou. */
function somVitoria(pct){
  const p = pct == null ? 100 : pct;
  if(p >= 90){
    frase([[523,0,.13],[659,.11,.13],[784,.22,.13],
           [1047,.33,.55,{vol:.24}],[1319,.36,.5,{vol:.13}],[1568,.40,.6,{vol:.10}]]);
    vibrar([22, 60, 22, 60, 50]);
  } else if(p >= 60){
    frase([[523,0,.14],[659,.12,.14],[784,.26,.42,{vol:.22}]]);
    vibrar([20, 50, 36]);
  } else {
    frase([[440,0,.16],[523,.14,.36,{vol:.18}]]);
    vibrar(24);
  }
}

/** Carimbo novo no passaporte: o baque do carimbo e o brilho depois. */
function somCarimbo(){
  frase([
    [160,  0,    0.11, {vol: 0.26, tipo: 'sine', brilho: false, glide: 90, ataque: 0.004}],
    [880,  0.07, 0.30, {vol: 0.14, tipo: 'sine'}],
    [1319, 0.13, 0.34, {vol: 0.11, tipo: 'sine'}]
  ]);

}

/** Evoluiu de veículo: subida curta, o momento mais alto da partida. */
function somEvoluiu(){
  frase([[392,0,.1],[523,.08,.1],[659,.16,.1],[784,.24,.1],
         [1047,.32,.5,{vol:.24}],[1319,.34,.45,{vol:.12}]]);

/** Toque leve de interface, para escolhas que não são certo/errado. */

const reduzMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confete(qtd){
  if(reduzMovimento) return;
  const cores = ['#FFC53D','#6C4DFF','#22C58B','#FF5A6E','#3B82F6','#FF6FA3'];
  for(let i=0;i<qtd;i++){
    const c = document.createElement('span');
    c.className = 'confete';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = cores[i % cores.length];
    c.style.animationDelay = (Math.random()*0.4) + 's';
    c.style.animationDuration = (1.2 + Math.random()*0.9) + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2600);
  }
}
function xpVoando(el, texto){
  if(!el || reduzMovimento) return;
  const r = el.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'xp-voa'; s.textContent = texto;
  s.style.left = (r.left + r.width/2) + 'px'; s.style.top = (r.top) + 'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(), 1100);
}
function toast(html){
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role','status'); t.innerHTML = html;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{ t.classList.remove('on'); setTimeout(()=>t.remove(), 400); }, 2800);
}

  let id;
  do {
    id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  } while(lista.some(p => p.id === id));
  lista.push({id, nome, icone: icone || '🙂', criadoEm: Date.now()});
  salvarPerfis(lista);
  definirPerfilAtivo(id);
  return id;
}

function excluirPerfil(id){
  const lista = lerPerfis().filter(p => p.id !== id);
  salvarPerfis(lista);
  try{
    [STORAGE, CARIMBOS_KEY, STATS_KEY].forEach(base=>{
      localStorage.removeItem(`${base}::${id}`);
    });
  }catch(e){}
  if(perfilAtivo() === id){
    definirPerfilAtivo(lista.length ? lista[0].id : '');
  }
}

// ---------- backup: exportar / importar ----------
function exportarProgresso(){
  const dados = {
    app: 'Passaporte do Saber',
    versao: 2,
    exportadoEm: new Date().toISOString(),
    perfis: lerPerfis(),
    dados: {}
  };
  lerPerfis().forEach(p => {
    dados.dados[p.id] = {};
    [STORAGE, CARIMBOS_KEY, STATS_KEY].forEach(base=>{
      try{
        const v = localStorage.getItem(`${base}::${p.id}`);
        if(v) dados.dados[p.id][base] = v;
      }catch(e){}
    });
  });

  const blob = new Blob([JSON.stringify(dados,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'passaporte-progresso-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function importarProgresso(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(!d.perfis || !d.dados) throw new Error('arquivo inválido');
      const atuais = lerPerfis();
      d.perfis.forEach(p => { if(!atuais.find(x => x.id === p.id)) atuais.push(p); });
      salvarPerfis(atuais);
      Object.keys(d.dados).forEach(pid => {
        Object.keys(d.dados[pid]).forEach(base => {
          try{ localStorage.setItem(`${base}::${pid}`, d.dados[pid][base]); }catch(er){}
        });
      });
      alert('Progresso restaurado com sucesso!');
      renderPerfis();
    }catch(err){
      alert('Não consegui ler este arquivo. Verifique se é um backup do Passaporte do Saber.');
    }
  };
  reader.readAsText(file);
}

// ---------- missão do dia e sequência de dias ----------
function registrarResposta(ok){
  const s = lerStats();
  const k = isoDe(hoje());
  s.dias = s.dias || {};
  s.dias[k] = s.dias[k] || {acertos:0, respondidas:0};
  s.dias[k].respondidas++;
  if(ok) s.dias[k].acertos++;
  salvarStats(s);
  if(ok) checarMissao();
}
function missaoHoje(){
  const s = lerStats();
  const d = (s.dias||{})[isoDe(hoje())] || {acertos:0};
  return {acertos: Math.min(d.acertos, META_DIA), meta: META_DIA, feita: !!(s.missoes||{})[isoDe(hoje())]};
}
function checarMissao(){
  const s = lerStats();
  const k = isoDe(hoje());
  s.missoes = s.missoes || {};
  if(s.missoes[k]) return;
  const d = (s.dias||{})[k];
  if(!d || d.acertos < META_DIA) return;
  s.missoes[k] = Date.now();
  s.xp = (s.xp || 0) + 30;
  salvarStats(s);
  darCarimbo('missao');
  somCarimbo(); confete(60);
  toast('🏹 Missão de hoje cumprida! +30 XP');
}
function sequenciaDias(){
  const dias = lerStats().dias || {};
  const ativo = d => dias[isoDe(d)] && dias[isoDe(d)].respondidas > 0;
  let d = hoje();
  if(!ativo(d)) d = new Date(d.getTime() - 86400000);   // ainda não jogou hoje: conta até ontem
  let n = 0;
  while(ativo(d)){ n++; d = new Date(d.getTime() - 86400000); }
  return n;
}

function maiorSequencia(){
  let max = 0, atual = 0;
  order.forEach((q,i)=>{
    if(answers[i] !== null && respostaCerta(i)){ atual++; max = Math.max(max,atual); }
    else if(answers[i] !== null){ atual = 0; }
  });
  return max;
}

function verificarCarimbos(){
  const score = getScore();
  const total = order.length;
  const pct = total ? score/total : 0;

  const stats = lerStats();
  stats.respondidas = (stats.respondidas || 0) + answers.filter(a=>a!==null).length;
  stats.partidas[current.id] = (stats.partidas[current.id] || 0) + 1;
  salvarStats(stats);

  darCarimbo('primeira');
  if(pct === 1 && total >= 10 && !temaJogo && !modoRevisao) darCarimbo('nota10');
  else if(pct >= 0.8 && total >= 5) darCarimbo('quase');
  if(maiorSequencia() >= 5) darCarimbo('sequencia');
  if(getVehicleIndex(score) >= 7) darCarimbo('foguete');
  if(modoRevisao && pct === 1) darCarimbo('cacador');
  if(stats.partidas[current.id] >= 3) darCarimbo('insistente');
  if(stats.respondidas >= 200) darCarimbo('maratona');
  if(sequenciaDias() >= 3) darCarimbo('constante');

  const prox = proximoDaMateria(current.id);
  if(prox && diasAte(prox.data) <= 7) darCarimbo('preparado');

  const jogadas = subjects.filter(s => stats.partidas[s.id]);
  if(jogadas.some(s => s.lingua === 'en') && jogadas.some(s => s.lingua !== 'en')) darCarimbo('bilingue');
  if(jogadas.length === subjects.length) darCarimbo('explorador');
}

// guarda o estado atual da partida para poder retomar
function persistirPartida(){
  if(!current || !order.length || temaJogo || revendo) return;
  const anterior = lerProgresso()[current.id] || {};
  salvarProgresso(current.id, {
    ...anterior,
    perguntas: order.map(q => q.q),
    answers: answers,
    idx: idx,
    modoRevisao: modoRevisao,
    semeadura: semeadura,   // sem isso, ao retomar as alternativas trocariam de lugar
    quando: Date.now()
  });
}

// registra erros (para o modo revisão) e o melhor resultado (para as estrelas)
function registrarResultado(){
  if(!current || temaJogo) return;
  const tudo = lerProgresso();
  const anterior = tudo[current.id] || {};
  const pct = order.length ? getScore()/order.length : 0;
  const novo = {...anterior, answers: [], concluidoEm: Date.now()};
  if(!modoRevisao){
    novo.erradas = order
      .map((q,i) => (answers[i] !== null && !respostaCerta(i)) ? q.q : null)
      .filter(Boolean);
    novo.melhor = Math.max(anterior.melhor || 0, pct);
  } else {
    // na revisão, tira da lista o que acertou agora
    const acertou = new Set(order.filter((q,i) => respostaCerta(i)).map(q => q.q));
    novo.erradas = (anterior.erradas || []).filter(t => !acertou.has(t));
  }
  salvarProgresso(current.id, novo);
}

function contarErrosSalvos(subjectId){
  const p = lerProgresso()[subjectId];
  return (p && p.erradas) ? p.erradas.length : 0;
}
function temPartidaEmAndamento(subjectId){
  const p = lerProgresso()[subjectId];
  return p && Array.isArray(p.answers) && p.answers.some(a => a !== null)
           && p.answers.some(a => a === null);
}
function estrelasDe(pct){
  if(pct >= 0.9) return 3;
  if(pct >= 0.7) return 2;
  if(pct >= 0.4) return 1;
  return 0;
}
function estrelasMateria(id){
  const p = lerProgresso()[id];
  return p && p.melhor ? estrelasDe(p.melhor) : 0;
}
function estrelasHtml(n){
  return [0,1,2].map(i => `<span class="${i < n ? '' : 'off'}">⭐</span>`).join('');
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
// =========================================================
//  TIPOS DE QUESTÃO
//
//  Uma resposta guardada em answers[i] pode ter três formatos:
//    escolha → o número da alternativa escolhida        (ex.: 2)
//    ordenar → {ordem: [...]}   a sequência que a criança montou
//    ligar   → {pares: {esq: dir}}  as ligações que ela fez
//  null continua significando "ainda não respondeu", em todos eles.
//
//  Tudo que precisa saber se a questão foi acertada passa por
//  respostaCerta(), para não existir uma regra diferente em cada tela.
// =========================================================
function tipoDe(q){ return (q && q.tipo) || 'escolha'; }

function respostaCerta(i){
  const q = order[i], a = answers[i];
  if(q == null || a == null) return false;
  switch(tipoDe(q)){
    case 'ordenar':
      return Array.isArray(a.ordem)
          && a.ordem.length === q.itens.length
          && a.ordem.every((t, k) => t === q.itens[k]);
    case 'ligar':
      return a.pares && q.pares.every(([e, d]) => a.pares[e] === d);
    default:
      return a === q.correct;
  }
}

/** O gabarito em texto — serve para as cartas de estudo e para a revisão. */
function respostaTexto(q){
  switch(tipoDe(q)){
    case 'ordenar': return q.itens.map((t, i) => `${i + 1}. ${t}`).join('<br>');
    case 'ligar':   return q.pares.map(([e, d]) => `${e} → ${d}`).join('<br>');
    default:        return q.opts[q.correct];
  }
}

function getScore(){
  return answers.reduce((acc, ans, i) => acc + (ans !== null && respostaCerta(i) ? 1 : 0), 0);
}

// =========================================================
//  INÍCIO DE PARTIDAS
// =========================================================
/**
 * Embaralhador com semente: a mesma semente devolve sempre o mesmo
 * resultado. Isso permite retomar uma partida salva e reencontrar as
 * alternativas exatamente onde estavam.
 */
function embaralharCom(lista, semente){
  const a = lista.slice();
  let s = (semente >>> 0) || 1;
  for(let i = a.length - 1; i > 0; i--){
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * As alternativas corretas vinham quase sempre em primeiro lugar, porque
 * quem escreve o conteúdo digita a resposta certa antes das outras. Dava
 * para gabaritar escolhendo "A" sem ler nada.
 *
 * Embaralhar aqui, na hora de jogar, resolve de vez: a posição muda a cada
 * partida, então nem a criança decora posição nem conteúdo novo escrito
 * por outra pessoa reintroduz o padrão.
 */
function embaralharOpcoes(q, semente){
  // semente 0 = partida salva antes desta mudança. Mantém a ordem original,
  // senão as respostas já gravadas passariam a apontar para a alternativa errada.
  if(!semente) return q;
  if(tipoDe(q) !== 'escolha' || !Array.isArray(q.opts)) return q;
  const certa = q.opts[q.correct];
  const opts = embaralharCom(q.opts, hash(q.q) ^ semente);
  return {...q, opts, correct: opts.indexOf(certa)};
}

function novaPartida(perguntas, semente){
  semeadura = semente || (Date.now() >>> 0) || 1;
  order = perguntas.map(q => embaralharOpcoes(q, semeadura));
  answers = new Array(order.length).fill(null);
  idx = 0; vehicleIndex = 0; justEvolved = false; xpPartida = 0; animarResposta = null; revendo = false;
  carimbosNovos = [];
  renderQuestion();
}
function startSubject(id){
  current = materia(id);
  modoRevisao = false; temaJogo = null;
  novaPartida(shuffle(current.questions));
}
function jogarTema(id, i){
  current = materia(id);
  const tema = temasDe(current)[i];
  if(!tema) return renderMateria(id);
  modoRevisao = false; temaJogo = tema;
  novaPartida(shuffle(current.questions.filter(q => q.tema === tema)));
}
function jogarSurpresa(){
  // 10 perguntas de matérias variadas, priorizando as que têm avaliação mais perto
  const prox = proximosEventos();
  const foco = prox.length ? prox[0].materias : subjects.map(s => s.id);
  const base = shuffle(subjects.filter(s => foco.includes(s.id)).flatMap(s => s.questions.map(q => ({...q, _mat:s.id}))));
  const resto = shuffle(subjects.filter(s => !foco.includes(s.id)).flatMap(s => s.questions.map(q => ({...q, _mat:s.id}))));
  current = {id:'surpresa', name:'Desafio surpresa', icon:'🎲', cor:'#6C4DFF', lingua:'pt', questions:[]};
  modoRevisao = false; temaJogo = 'Surpresa';
  novaPartida(shuffle(base.slice(0,6).concat(resto.slice(0,4))));
}

// retoma uma partida interrompida
function retomar(id){
  const p = lerProgresso()[id];
  current = materia(id);
  if(!p || !current){ startSubject(id); return; }
  const porEnunciado = {};
  current.questions.forEach(q => { porEnunciado[q.q] = q; });
  const remontada = (p.perguntas || []).map(txt => porEnunciado[txt]).filter(Boolean);
  // se o conteúdo mudou desde a última vez, começa limpo
  if(!remontada.length || remontada.length !== (p.perguntas||[]).length){
    limparProgresso(id); startSubject(id); return;
  }
  semeadura = p.semeadura || 0;
  order = remontada.map(q => embaralharOpcoes(q, semeadura));
  answers = p.answers.slice(0, order.length);
  while(answers.length < order.length) answers.push(null);
  idx = Math.min(p.idx || 0, order.length - 1);
  modoRevisao = !!p.modoRevisao; temaJogo = null;
  vehicleIndex = getVehicleIndex(getScore());
  justEvolved = false; xpPartida = 0; animarResposta = null; revendo = false;
  carimbosNovos = [];
  renderQuestion();
}

// joga só as perguntas erradas da última partida
function revisarErros(id){
  const p = lerProgresso()[id];
  current = materia(id);
  if(!p || !p.erradas || !current){ startSubject(id); return; }
  const set = new Set(p.erradas);
  const soErradas = current.questions.filter(q => set.has(q.q));
  if(!soErradas.length){ startSubject(id); return; }
  modoRevisao = true; temaJogo = null;
  novaPartida(shuffle(soErradas));
}

const REACOES = {
  pt:{ok:['Mandou bem!','Isso aí!','Arrasou!','Na mosca!','Show de bola!','Que craque!'],
      nao:['Quase! Olha só:','Não foi dessa vez. Veja:','Opa! Vamos entender:','Tudo bem errar. Repara:']},
  en:{ok:['Great job!','Awesome!','You got it!','Well done!','Super!'],
      nao:['Almost! Look:','Not quite. Here is why:','Oops! Let\'s see:']}
};
function anfitriao(q){
  const nomes = TURMA.filter(a => new RegExp('(^|[^\\wÀ-ÿ])' + a.nome + '(?![\\wÀ-ÿ])').test(q.q));
  return nomes.length ? nomes[0] : TURMA[hash(q.q) % TURMA.length];
}
function linguaDe(q){
  if(q._mat) return (materia(q._mat)||{}).lingua || 'pt';
  return current.lingua || 'pt';
}
function combo(){
  let n = 0;
  for(let i = idx; i >= 0; i--){
    if(answers[i] === null) continue;
    if(respostaCerta(i)) n++; else break;
  }
  return n;
}

function renderQuestion(){
  const q = order[idx];
  const given = answers[idx];
  const respondida = given !== null;
  const score = getScore();
  const lingua = linguaDe(q);
  const host = anfitriao(q);
  const respondidas = answers.filter(a => a !== null).length;
  const pct = Math.round((respondidas / order.length) * 100);
  const seq = combo();
  const matQ = q._mat ? materia(q._mat) : current;

  const v = vehicles[vehicleIndex];
  const next = vehicles[vehicleIndex+1];
  let vpct = 100, sub = 'Nível máximo de transporte!';
  if(next){
    vpct = Math.max(0, Math.min(100, Math.round(((score - v.min) / (next.min - v.min)) * 100)));
    const faltam = Math.max(0, next.min - score);
    sub = `${faltam === 1 ? 'Falta 1 acerto' : 'Faltam ' + faltam + ' acertos'} para viajar ${next.name.toLowerCase()} ${next.icon}`;
  }

  const opts = q.opts.map((opt, i) => {
    let cls = 'opcao', marca = '';
    if(respondida){
      if(i === q.correct){ cls += ' certa'; marca = '✓'; }
      else if(i === given){ cls += ' errada'; marca = '✕'; }
      else cls += ' apagada';
    }
    return `<button class="${cls}" ${respondida ? 'disabled' : ''} onclick="selectAnswer(${i}, this)">
      <span class="letra l${i}" aria-hidden="true">${'ABCDE'[i]}</span><span>${opt}</span>${marca ? `<span class="marca-resp" aria-hidden="true">${marca}</span>` : ''}
    </button>`;
  }).join('');

  let retorno = '';
  if(respondida){
    const ok = given === q.correct;
    const lista = REACOES[lingua][ok ? 'ok' : 'nao'];
    retorno = `<div class="retorno ${ok ? 'ok' : 'nao'}" role="status">${avatarHtml(host)}<div><b>${ok ? '🎉' : '💡'} ${lista[hash(q.q) % lista.length]}</b>${q.fb}</div></div>`;
  }

  const isLast = idx === order.length - 1;
  const sair = current.id === 'surpresa' ? 'backToMenu()' : `renderMateria('${current.id}')`;
  const titulo = temaJogo && temaJogo !== 'Surpresa' ? `${current.icon} ${temaJogo}` : `${current.icon} ${current.name}`;

  tela(`
    ${modoRevisao ? '<div class="faixa-modo">🎯 Modo revisão: só as que você errou</div>' : ''}
    ${temaJogo ? `<div class="faixa-modo tema">${titulo}</div>` : ''}
    <div class="jogo-topo">
      <button class="voltar-ic" onclick="${sair}" aria-label="Pausar e sair">←</button>
      <div class="progresso" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso"><div class="progresso-barra" style="width:${pct}%"></div></div>
      <span class="contador">${idx+1}/${order.length}</span>
      <span class="combo ${seq >= 3 && animarResposta === 'ok' ? 'quente' : ''}" aria-label="Sequência de acertos">🔥 ${seq}</span>
    </div>

    ${justEvolved ? `<div class="evoluiu-banner">🎉 Evoluiu! Agora você viaja ${v.name.toLowerCase()} ${v.icon}</div>` : ''}
    <div class="veiculo">
      <div class="veiculo-ic ${justEvolved ? 'evoluiu' : ''}" aria-hidden="true">${v.icon}</div>
      <div class="veiculo-info">
        <div class="veiculo-nome">${v.name} · ${score} acerto${score===1?'':'s'}</div>
        <div class="veiculo-trilho"><div class="veiculo-barra" style="width:${vpct}%"></div></div>
        <div class="veiculo-sub">${sub}</div>
      </div>
    </div>

    <div class="card ${animarResposta === 'nao' ? 'treme' : ''}">
      <div class="host">
        ${avatarHtml(host)}
        <div class="host-txt">${host.nome} ${lingua === 'en' ? 'asks' : 'pergunta'}:<small>${matQ.icon} ${matQ.name} · ${q.tema}</small></div>
      </div>
      <p class="pergunta">${q.q}</p>
      <div class="opcoes">${opts}</div>
      ${retorno}
    </div>

    <div class="nav-jogo">
      <button class="btn btn-claro" onclick="prevQuestion()" ${idx === 0 ? 'disabled' : ''} aria-label="Pergunta anterior">←<span class="rot"> Anterior</span></button>
      <button class="btn btn-sol" onclick="${sair}" aria-label="Pausar e voltar">🏠<span class="rot"> Pausar</span></button>
      <button class="btn btn-primario btn-proxima" onclick="nextQuestion()" ${respondida ? '' : 'disabled'}>${isLast ? '🏁 Ver resultado' : 'Próxima →'}</button>
    </div>
  `, true, animarResposta !== null);
  justEvolved = false;
  animarResposta = null;
}

function selectAnswer(i, el){
  if(answers[idx] !== null || revendo) return;
  answers[idx] = i;
  const ok = i === order[idx].correct;
  const oldVi = vehicleIndex;
  vehicleIndex = getVehicleIndex(getScore());
  justEvolved = vehicleIndex > oldVi;
  animarResposta = ok ? 'ok' : 'nao';

  if(ok){
    const seq = combo();
    const bonus = seq >= 3 ? 5 : 0;
    const ganho = 10 + bonus;
    xpPartida += ganho;
    const stats = lerStats(); stats.xp = (stats.xp || 0) + ganho; salvarStats(stats);
    xpVoando(el, `+${ganho} XP`);
    // evoluir de veículo é o momento maior: toca a fanfarra no lugar
    // do acerto comum, para os dois sons não se atropelarem
    if(justEvolved){ somEvoluiu(); confete(30); }
    else somAcerto(seq);
  } else {
    somErro();
  }
  registrarResposta(ok);
  persistirPartida();
  renderQuestion();
  // mantém o retorno visível sem precisar rolar
  const r = document.querySelector('.retorno');
  if(r && r.scrollIntoView) r.scrollIntoView({behavior: reduzMovimento ? 'auto' : 'smooth', block:'nearest'});
}

function prevQuestion(){ if(idx > 0){ idx--; renderQuestion(); } }
function nextQuestion(){
  if(answers[idx] === null) return;
  if(idx < order.length - 1){ idx++; renderQuestion(); }
  else renderEnd();
}

// =========================================================
//  RESULTADO
// =========================================================
function desempenhoPorTema(){
  const mapa = {};
  order.forEach((q,i)=>{
    if(answers[i] === null) return;
    if(!mapa[q.tema]) mapa[q.tema] = {tema:q.tema, mat:q._mat || current.id, acertos:0, total:0};
    mapa[q.tema].total++;
    if(respostaCerta(i)) mapa[q.tema].acertos++;
  });
  return Object.values(mapa)
    .map(t => ({...t, pct: t.total ? t.acertos/t.total : 0}))
    .sort((a,b) => a.pct - b.pct);
}
function nivelTema(pct){
  if(pct >= 0.8) return {classe:'forte', rotulo:'Mandou bem', icone:'✅'};
  if(pct >= 0.5) return {classe:'medio', rotulo:'Quase lá',   icone:'⚠️'};
  return {classe:'fraco', rotulo:'Revisar',  icone:'📕'};
}
function htmlNovosCarimbos(){
  if(!carimbosNovos.length) return '';
  return `
    <div class="novos-carimbos">
      <div class="nc-tit">🎉 ${carimbosNovos.length === 1 ? 'Novo carimbo!' : 'Novos carimbos!'}</div>
      ${carimbosNovos.map(c=>`<div class="nc-item"><span aria-hidden="true">${c.icon}</span><span>${c.nome}<br><small>${c.desc}</small></span></div>`).join('')}
    </div>`;
}

function renderEnd(){
  if(!revendo){
    if(current.id !== 'surpresa') registrarResultado();
    verificarCarimbos();
  }
  const score = getScore();
  const total = order.length;
  const pct = Math.round((score/total)*100);
  const est = estrelasDe(score/total);
  let titulo, msg;
  if(pct === 100){ titulo = 'Viagem perfeita!'; msg = 'Você acertou tudo. Passaporte carimbado com louvor!'; }
  else if(pct >= 80){ titulo = 'Excelente viagem!'; msg = 'Faltou só um pouquinho para gabaritar.'; }
  else if(pct >= 60){ titulo = 'Boa viagem!'; msg = 'Vale revisar os temas marcados abaixo.'; }
  else { titulo = 'Viagem de treino!'; msg = 'Cada erro mostra o que estudar. Use as lições e tente de novo!'; }

  if(pct >= 60 && !revendo){ somVitoria(pct); confete(pct === 100 ? 90 : 50); }

  const v = vehicles[getVehicleIndex(score)];
  const temas = desempenhoPorTema();
  const voltar = current.id === 'surpresa' ? 'backToMenu()' : `renderMateria('${current.id}')`;

  tela(`
    <div class="card fim">
      <div class="fim-estrelas" aria-label="${est} de 3 estrelas">${estrelasHtml(est)}</div>
      <h2>${titulo}</h2>
      <div class="placar">
        <div><b>${score}/${total}</b><span>acertos</span></div>
        <div><b>${pct}%</b><span>aproveitamento</span></div>
        <div><b>+${xpPartida}</b><span>XP</span></div>
      </div>
      <p>Você terminou a viagem <b>${v.name.toLowerCase()} ${v.icon}</b>. ${msg}</p>
      ${htmlNovosCarimbos()}

      <div class="mapa">
        <h2 class="secao-titulo" style="margin-top:8px">🧭 Seu mapa de temas</h2>
        ${temas.map(t=>{
          const n = nivelTema(t.pct);
          const ti = materia(t.mat) ? temasDe(materia(t.mat)).indexOf(t.tema) : -1;
          return `
          <div class="mapa-linha ${n.classe}">
            <div class="mapa-topo"><span>${n.icone} ${t.tema}</span><span>${t.acertos}/${t.total}</span></div>
            <div class="mapa-trilho"><div class="mapa-barra" style="width:${Math.round(t.pct*100)}%"></div></div>
            ${t.pct < 0.8 && ti >= 0 ? `<button class="mapa-btn" onclick="iniciarEstudo('${t.mat}', ${JSON.stringify(t.tema).replace(/"/g,'&quot;')})">📚 Estudar este tema</button>` : ''}
          </div>`;
        }).join('')}
      </div>

      <h2 class="secao-titulo">🔍 Suas respostas</h2>
      <div class="revisao">
        ${order.map((q, i) => {
          const ok = respostaCerta(i);
          return `<div class="rv"><span class="rv-m ${ok ? 'ok' : 'no'}" aria-label="${ok ? 'acertou' : 'errou'}">${ok ? '✓' : '✕'}</span><span><b>${q.tema}</b> · ${q.q.replace(/<[^>]*>/g,'')}</span></div>`;
        }).join('')}
      </div>

      <div class="acoes">
        <button class="btn btn-primario" onclick="reviewAnswers()">🔍 Rever as questões</button>
        <button class="btn btn-claro" onclick="jogarDeNovo()">🔁 Jogar de novo</button>
        <button class="btn btn-sol" onclick="${voltar}">← Voltar</button>
      </div>
    </div>
  `);
}
function jogarDeNovo(){
  if(current.id === 'surpresa') return jogarSurpresa();
  if(temaJogo) return jogarTema(current.id, temasDe(current).indexOf(temaJogo));
  if(modoRevisao) return revisarErros(current.id);
  startSubject(current.id);
}
function reviewAnswers(){ revendo = true; idx = 0; renderQuestion(); }

// =========================================================
//  MEU PASSAPORTE (coleção de carimbos)
// =========================================================
function renderPassaporte(){
  persistirPartida();
  const ganhos = lerCarimbos();
  const stats = lerStats();
  const qtd = Object.keys(ganhos).length;
  const estrelas = subjects.reduce((n,s) => n + estrelasMateria(s.id), 0);
  tela(`
    <button class="voltar" onclick="backToMenu()">← Início</button>
    <h2 class="secao-titulo" style="margin-top:0">🛂 Meu Passaporte</h2>
    <div class="resumo">
      <div><b>${qtd}</b><span>carimbos</span></div>
      <div><b>${estrelas}</b><span>estrelas</span></div>
      <div><b>${stats.respondidas||0}</b><span>respostas</span></div>
    </div>
    <div class="carimbos">
      ${CARIMBOS.map(c => {
        const tem = !!ganhos[c.id];
        return `<div class="carimbo ${tem ? 'ganho' : 'bloq'}">
          <div class="cb-ic" aria-hidden="true">${tem ? c.icon : '❔'}</div>
          <div class="cb-nome">${c.nome}</div>
          <div class="cb-desc">${c.desc}</div>
        </div>`;
      }).join('')}
    </div>
  `);
}

// =========================================================
//  VERSÃO
//  Código visível no rodapé para conferir que todos estão
//  na mesma versão. Também fica em window.PASSAPORTE_VERSAO.
// =========================================================
const PASSAPORTE_VERSAO = 'v2026.11.08·E6D037';
window.PASSAPORTE_VERSAO = PASSAPORTE_VERSAO;
console.info('Passaporte do Saber ' + PASSAPORTE_VERSAO);

function copiarVersao(){
  const selo = document.getElementById('versaoSelo');
  const marca = document.getElementById('versaoCopiar');
  const texto = 'Passaporte do Saber ' + PASSAPORTE_VERSAO;

  const confirmar = () => {
    if(!selo || !marca) return;
    selo.classList.add('copiado');
    marca.textContent = '✓';
    setTimeout(() => {
      selo.classList.remove('copiado');
      marca.textContent = '⧉';
    }, 1800);
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(confirmar).catch(() => selecionarVersao());
  } else {
    selecionarVersao();
  }

  // sem acesso à área de transferência, deixa o texto selecionado para copiar à mão
  function selecionarVersao(){
    try{
      const alvo = document.querySelector('.versao-cod');
      const faixa = document.createRange();
      faixa.selectNodeContents(alvo);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(faixa);
    }catch(e){}
  }
}

// =========================================================
//  PERFIS
// =========================================================
const ICONES_PERFIL = ['🙂','🚀','🦊','🐢','🦁','🐼','🦄','⚽','🎸','🌟','🐙','🦖'];
let iconeEscolhido = ICONES_PERFIL[0];

function renderPerfis(){
  persistirPartida();
  const perfis = lerPerfis();
  const ativo = perfilAtivo();
  const lista = perfis.length ? perfis.map(p => `
    <div class="perfil ${p.id===ativo?'ativo':''}">
      <button class="perfil-btn" onclick="trocarPerfil('${p.id}')">
        <div class="avatar" aria-hidden="true">${p.icone}</div>
        <span class="perfil-nome">${esc(p.nome)}${p.id===ativo?'<small>estudando agora</small>':''}</span>
      </button>
      <button class="perfil-del" onclick="confirmarExcluirPerfil('${p.id}')" aria-label="Excluir perfil de ${esc(p.nome)}">🗑</button>
    </div>`).join('') : '<p class="texto-ajuda">Ainda não tem ninguém aqui. Crie o primeiro perfil!</p>';

  tela(`
    ${perfis.length ? '<button class="voltar" onclick="backToMenu()">← Início</button>' : ''}
    <h2 class="secao-titulo" style="margin-top:0">👥 Quem vai estudar?</h2>
    ${avisoArmazenamento()}
    ${lista}

    <section class="card">
      <h3 class="secao-titulo" style="margin-top:0">➕ Novo aluno</h3>
      <label class="rotulo" for="novoNome">Nome</label>
      <input type="text" id="novoNome" class="campo" placeholder="Digite o nome" maxlength="20" autocomplete="off">
      <div class="rotulo">Escolha um ícone</div>
      <div class="icones">
        ${ICONES_PERFIL.map(ic=>`<button class="icone-op ${ic===iconeEscolhido?'sel':''}" onclick="selecionarIcone(this,'${ic}')" aria-label="Ícone ${ic}">${ic}</button>`).join('')}
      </div>
      <button class="btn btn-primario btn-bloco" onclick="adicionarPerfil()">Criar perfil</button>
    </section>

    <section class="card">
      <h3 class="secao-titulo" style="margin-top:0">💾 Backup do progresso</h3>
      <p class="texto-ajuda">O progresso fica salvo neste aparelho. Para levar para outro aparelho
      (ou não perder se limpar o navegador), baixe o backup e depois restaure.</p>
      <div class="acoes" style="margin-top:0">
        <button class="btn btn-claro" onclick="exportarProgresso()">⬇️ Baixar backup</button>
        <label class="btn btn-sol">⬆️ Restaurar backup
          <input type="file" accept=".json" style="display:none" onchange="if(this.files[0]) importarProgresso(this.files[0])">
        </label>
      </div>
    </section>
  `);
}
function selecionarIcone(el, ic){
  iconeEscolhido = ic;
  document.querySelectorAll('.icone-op').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}
function adicionarPerfil(){
  const nome = (document.getElementById('novoNome').value || '').trim();
  if(!nome){ alert('Digite o nome do aluno.'); return; }
  criarPerfil(nome, iconeEscolhido);
  backToMenu();
}
function trocarPerfil(id){ definirPerfilAtivo(id); backToMenu(); }
function confirmarExcluirPerfil(id){
  const p = lerPerfis().find(x => x.id === id);
  if(!p) return;
  if(!confirm(`Excluir o perfil de ${p.nome}? Todo o progresso e os carimbos serão apagados.`)) return;
  excluirPerfil(id);
  renderPerfis();
}

// ---------- início ----------
if(!armazenamentoOK){
  // sem armazenamento (file:// bloqueado): perfil temporário em memória
  perfisMemoria = [{id:'temp', nome:'Visitante', icone:'🙂'}];
  perfilMemoriaAtivo = 'temp';
  renderMenu();
} else if(!lerPerfis().length || !perfilAtivo()){
  renderPerfis();
} else {
  renderMenu();
}
</script>
